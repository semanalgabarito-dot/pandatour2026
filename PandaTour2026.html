<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PandaTour Master Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #C9A84C;
            --dark-bg: #050505;
            --card-bg: #121212;
            --border: #1f1f1f;
            --text: #ffffff;
            --text-dim: #888;
            --green: #1db954;
            --red: #ff4b2b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* BARRA SUPERIOR */
        .header {
            padding: 20px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .header h1 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: 2px; font-weight: 900; }

        /* RESUMO FINANCEIRO (DASHBOARD) */
        .dashboard {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px;
        }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 15px; border-radius: 12px; text-align: center;
        }
        .stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--gold); }

        /* FILTROS RÁPIDOS */
        .filters {
            display: flex; gap: 8px; padding: 0 15px 15px; overflow-x: auto;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: var(--card-bg); border: 1px solid var(--border);
            color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; white-space: nowrap;
            cursor: pointer;
        }
        .filter-btn.active { background: var(--gold); color: black; border-color: var(--gold); font-weight: bold; }

        /* LISTA DE SERVIÇOS */
        .list-container { padding: 0 15px 100px; }
        
        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            position: relative;
        }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .time { font-size: 24px; font-weight: 900; color: white; }
        .status-pill {
            font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 6px;
            text-transform: uppercase;
        }

        .client-info { font-size: 17px; font-weight: 600; margin-bottom: 6px; color: var(--gold); }
        .route { font-size: 14px; color: var(--text-dim); margin-bottom: 15px; line-height: 1.5; }
        
        .footer-card {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 12px; border-top: 1px solid #1f1f1f;
        }
        .driver-name { font-size: 12px; color: white; background: #222; padding: 5px 12px; border-radius: 6px; font-weight: 600; }
        .price { font-size: 20px; font-weight: 900; color: white; }

        /* INDICADOR ONLINE */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1>PANDATOUR <span style="font-size: 10px; color: white; font-weight: 200;">ADMIN</span></h1>
    <div><span class="status-dot"></span><span style="font-size: 10px;">LIVE</span></div>
</div>

<div class="dashboard">
    <div class="stat-card">
        <div class="stat-label">Serviços Hoje</div>
        <div class="stat-value" id="count-today">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Ganhos Hoje</div>
        <div class="stat-value" id="revenue-today">0.00€</div>
    </div>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="setFilter('TUDO', this)">Tudo</button>
    <button class="filter-btn" onclick="setFilter('MAURO', this)">Mauro</button>
    <button class="filter-btn" onclick="setFilter('IGOR', this)">Igor</button>
    <button class="filter-btn" onclick="setFilter('IDALINA', this)">Idalina</button>
    <button class="filter-btn" onclick="setFilter('CARLA', this)">Carla</button>
</div>

<div class="list-container" id="services-list">
    <div style="text-align:center; padding:50px; color:var(--text-dim)">A carregar dados do Supabase...</div>
</div>

<script>
    // CONFIGURAÇÃO DIRETA COM OS TEUS VALORES
    const SUPABASE_URL = "https://zfyeuskoesoydthznqzx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4ucctyTKbw9IweMsfPUq6w_m48n_-px";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentFilter = 'TUDO';

    async function loadData() {
        // Busca todos os serviços da tabela 'servicos'
        const { data, error } = await supabase
            .from('servicos')
            .select('*')
            .order('hora', { ascending: true });

        if (error) {
            document.getElementById('services-list').innerHTML = `<div style="color:red; text-align:center">Erro ao ligar: ${error.message}</div>`;
            return;
        }

        render(data);
    }

    function render(data) {
        const list = document.getElementById('services-list');
        const countToday = document.getElementById('count-today');
        const revToday = document.getElementById('revenue-today');

        // Filtrar por motorista ou agência
        let filtered = data;
        if (currentFilter !== 'TUDO') {
            filtered = data.filter(s => 
                (s.motorista && s.motorista.toUpperCase() === currentFilter) || 
                (s.agencia && s.agencia.toUpperCase() === currentFilter)
            );
        }

        // Atualizar o resumo (Dashboard)
        countToday.innerText = filtered.length;
        const total = filtered.reduce((acc, curr) => acc + (parseFloat(curr.valor_total) || 0), 0);
        revToday.innerText = total.toFixed(2) + '€';

        // Criar os cartões (Design Premium)
        if (filtered.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-dim)">Nenhum serviço encontrado.</div>`;
            return;
        }

        list.innerHTML = filtered.map(s => `
            <div class="service-card">
                <div class="card-top">
                    <div class="time">${s.hora ? s.hora.substring(0,5) : '--:--'}</div>
                    <div class="status-pill" style="background: ${s.estado === 'Pago' ? 'rgba(29,185,84,0.2)' : 'rgba(255,75,43,0.2)'}; color: ${s.estado === 'Pago' ? 'var(--green)' : 'var(--red)'}">
                        ● ${s.estado || 'PENDENTE'}
                    </div>
                </div>
                <div class="client-info">${s.cliente || 'Sem Nome'}</div>
                <div class="route">
                    <span style="color:var(--gold)">DE:</span> ${s.origem || '---'}<br>
                    <span style="color:var(--gold)">PARA:</span> ${s.destino || '---'}
                </div>
                <div class="footer-card">
                    <div class="driver-name">👤 ${s.motorista || 'A ATRIBUIR'}</div>
                    <div class="price">${s.valor_total || 0}€</div>
                </div>
            </div>
        `).join('');
    }

    function setFilter(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadData();
    }

    // Iniciar carregamento
    loadData();

    // REALTIME: Se mudares algo no Supabase, a App atualiza sozinha!
    supabase.channel('custom-all-channel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'servicos' }, (payload) => {
        loadData();
    })
    .subscribe();

</script>
</body>
</html>
