<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PandaTour Gestão 2026</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e8e8e8;font-size:13px}
    :root{--gold:#C9A84C;--gold2:#E8C96A;--dark:#0a0a0a;--dark2:#111;--dark3:#1a1a1a;--dark4:#242424;--bdr:#2a2a2a;--bdr2:#333;--red:#E24B4A;--green:#1D9E75;--text:#e8e8e8;--text2:#aaa}
    .topbar{background:#111;border-bottom:1px solid var(--bdr);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .logo-img{height:36px;width:auto}
    .tabs{display:flex;gap:4px;background:#1a1a1a;border-radius:8px;padding:3px;overflow-x:auto}
    .tab{padding:8px 16px;border-radius:5px;font-size:11px;cursor:pointer;border:none;background:transparent;color:var(--text2);white-space:nowrap}
    .tab.active{background:var(--gold);color:#000;font-weight:700}
    .sync-indicator{font-size:10px;color:var(--green);margin-right:10px;display:flex;align-items:center;gap:4px}
    .main{padding:15px;max-width:1600px;margin:0 auto}
    .panel{display:none} .panel.active{display:block}
    .tw{overflow-x:auto;border:1px solid var(--bdr2);border-radius:10px;background:var(--dark3);margin-top:15px}
    table{width:100%;border-collapse:collapse;font-size:11px}
    th{background:var(--dark2);padding:12px 10px;text-align:left;color:var(--gold);border-bottom:1px solid var(--bdr2);text-transform:uppercase;font-size:9px}
    td{padding:12px 10px;border-bottom:1px solid var(--bdr);color:var(--text)}
    .badge{padding:3px 8px;border-radius:5px;font-size:9px;font-weight:700;text-transform:uppercase;display:inline-block}
    .b-pago{background:#0d2a1a;color:#2ECC71;border:1px solid #1a4d2e}
    .b-falta{background:#2a0d0d;color:var(--red);border:1px solid #4d1a1a}
    .btn{padding:8px 15px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--bdr2);background:var(--dark4);color:#fff}
    .btn.primary{background:var(--gold);color:#000;border:none}
    .ls{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#000}
    .lc{background:var(--dark3);padding:40px;border-radius:24px;text-align:center;border:1px solid var(--bdr2);width:90%;max-width:380px}
</style>
</head>
<body>

<div id="login-view" class="ls">
    <div class="lc">
        <img src="https://semanalgabarito-dot.github.io/pandatour2026/LOGOSEMFUNDO.png" style="width:200px;margin-bottom:20px">
        <h1 style="font-size:11px;letter-spacing:4px;color:var(--text2);margin-bottom:30px">PANDATOUR GESTÃO 2026</h1>
        <button class="btn primary" style="width:100%;padding:18px" onclick="initApp()">ACEDER</button>
    </div>
</div>

<div id="app-view" style="display:none">
    <div class="topbar">
        <img src="https://semanalgabarito-dot.github.io/pandatour2026/LOGOSEMFUNDO.png" class="logo-img">
        <div class="tabs">
            <button class="tab active" onclick="showPanel('servicos',this)">📋 Serviços</button>
            <button class="tab" onclick="showPanel('anual',this)">📊 Anual</button>
            <button class="tab" onclick="showPanel('financeiro',this)">💰 Finanças</button>
        </div>
        <div style="display:flex;align-items:center">
            <span id="sync-status" class="sync-indicator">● Offline</span>
            <button class="btn" style="padding:6px 12px" onclick="fetchData()">↻</button>
        </div>
    </div>

    <div class="main">
        <div id="panel-servicos" class="panel active">
            <div class="tw">
                <table>
                    <thead>
                        <tr><th>Data/Hora</th><th>Tipo</th><th>Cliente</th><th>Trajeto</th><th>Motorista</th><th>Valor</th><th>Estado</th></tr>
                    </thead>
                    <tbody id="body-servicos"></tbody>
                </table>
            </div>
        </div>
        <div id="panel-anual" class="panel"><div class="tw"><table><thead><tr><th>Mês</th><th>Panda €</th><th>Carla €</th><th>Líquido</th></tr></thead><tbody id="body-anual"></tbody></table></div></div>
        <div id="panel-financeiro" class="panel"><div id="list-fin"></div></div>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvO4sFnYy5nqHrK1H1rEHhN-Fkjq4TDrEuLQfUrrDupIfJYTphEnGCzzenGqTwSd5_vw/exec";
let currentData = { servicos: [], anual: [] };

function initApp() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
    fetchData();
}

function showPanel(id, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    btn.classList.add('active');
}

async function fetchData() {
    const status = document.getElementById('sync-status');
    status.style.color = '#C9A84C';
    status.innerText = '● Atualizando...';
    try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        currentData = data;
        renderServicos(data.servicos || []);
        renderAnual(data.anual || []);
        status.style.color = '#1D9E75';
        status.innerText = '● Online ' + new Date().getHours() + ':' + String(new Date().getMinutes()).padStart(2, '0');
    } catch (e) {
        status.style.color = '#E24B4A';
        status.innerText = '● Erro Sinc.';
        document.getElementById('body-servicos').innerHTML = '<tr><td colspan="7" style="text-align:center">Erro ao ler o Google Sheets. Verifica o Script.</td></tr>';
    }
}

function renderServicos(list) {
    const body = document.getElementById('body-servicos');
    if(!list || list.length === 0) {
        body.innerHTML = '<tr><td colspan="7" style="text-align:center">Nenhum serviço encontrado.</td></tr>';
        return;
    }
    
    // ORDENAÇÃO SEGURA
    const sorted = [...list].sort((a, b) => {
        const dateA = new Date((a.data || '2026-01-01') + 'T' + (a.hora || '00:00'));
        const dateB = new Date((b.data || '2026-01-01') + 'T' + (b.hora || '00:00'));
        return dateA - dateB;
    });

    body.innerHTML = sorted.map(s => {
        const isPago = s.pago && s.pago.toString().toLowerCase().includes('pago');
        return `<tr>
            <td><div style="font-weight:700">${s.data || ''}</div><div style="color:var(--gold);font-size:10px">${s.hora || ''}</div></td>
            <td>${s.tipo || ''}</td>
            <td>${s.cliente || ''}</td>
            <td style="font-size:10px">${s.trajeto || s.destino || ''}</td>
            <td>${s.motorista || ''}</td>
            <td style="font-weight:700">${s.valor || 0}€</td>
            <td><span class="badge ${isPago ? 'b-pago' : 'b-falta'}">${isPago ? 'PAGO' : 'FALTA'}</span></td>
        </tr>`;
    }).join('');
}

function renderAnual(list) {
    const body = document.getElementById('body-anual');
    if(!list) return;
    body.innerHTML = list.map(m => `<tr><td>${m.mes}</td><td>${m.panda || 0}€</td><td>${m.carla_euro || 0}€</td><td style="font-weight:700;color:var(--green)">${m.liquido || 0}€</td></tr>`).join('');
}
</script>
</body>
</html>
